[package]
name = "jeb-core"
description = "JEB System One protocol (port of szybkie-ai/jeb prompt + decide), llama-server engine, model/runtime lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Same release as the Python `tokenizers` binding pinned by the official JEB server (uv.lock: 0.23.2),
# so prompts tokenize to identical ids.
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "io-util", "sync", "signal", "net", "io-std"] }
futures-util = "0.3"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
libc = "0.2"
log = "0.4"

[[bin]]
name = "jebd"
path = "src/bin/jebd.rs"
